name: OnePlus 9RT build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DFROOT_BUILD_ROOT: ${{ runner.temp }}/dfroot-op9rt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 curl
          sdkmanager 'platforms;android-37' 'build-tools;36.1.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build both modules from source
        run: bash scripts/build-modules.sh
      - name: Build debug APK
        run: bash scripts/build-apk.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: DFRoot-OnePlus9RT-debug
          path: |
            out/debug/*.apk
            out/debug/SHA256SUMS
          if-no-files-found: error
